name: gravity_mobile
description: Flutter member app for the Gravity multi-tenant fitness platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^16.2.1
  google_fonts: ^6.2.1
  image_picker: ^1.2.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
